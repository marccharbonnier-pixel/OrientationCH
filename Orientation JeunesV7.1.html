<!DOCTYPE html>

<style>
:root{--primary:#1a5f7a;--primary-dark:#0e3f52;--swiss:#d52b1e;--bg:#f4f7f9;--surface:#fff;--text:#1a202c;--muted:#64748b;--border:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,.08);--radius:14px;--success:#2e7d32;--warn:#ef6c00;--danger:#c62828;--teal:#00897b;--academic:#5e35b1;--cross:#c2185b;--vae:#00695c;--transition:#d84315}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
header.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;color:var(--primary)}
.compass{width:24px;height:24px;border-radius:50%;border:2px solid var(--primary);position:relative;flex-shrink:0}
.compass::before{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:8px solid var(--swiss)}
.compass::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:8px solid var(--primary)}
.lang-toggle{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.lang-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer;font-family:inherit}
.lang-toggle button.active{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--surface);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:1.55rem;color:var(--primary);margin-bottom:10px;line-height:1.3}
h2{font-size:1.15rem;color:var(--primary);margin:22px 0 12px}
h3{font-size:1rem;color:var(--primary);margin:16px 0 8px}
p{margin-bottom:14px}.lead{font-size:1rem;color:var(--muted);margin-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:10px;border:none;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;line-height:1.2}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#eaf0f4}
.btn-block{width:100%}.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.info-box{background:#eaf4f8;border-left:4px solid var(--primary);border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.92rem}
.warning-box{background:#fff8e1;border-left:4px solid var(--warn);border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.88rem}
.academic-box{background:#f3e5f5;border-left:4px solid var(--academic);border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.9rem}
.cross-box{background:#fce4ec;border-left:4px solid var(--cross);border-radius:8px;padding:16px 18px;margin:20px 0;font-size:.9rem}
.polarization-box{background:#e8f5e9;border-left:4px solid var(--success);border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.9rem}
.context-box{background:#fff3e0;border-left:4px solid var(--warn);border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.9rem}
.vae-box{background:#e0f2f1;border-left:4px solid var(--vae);border-radius:8px;padding:16px 18px;margin:20px 0;font-size:.9rem}
.transition-box{background:#fbe9e7;border-left:4px solid var(--transition);border-radius:8px;padding:20px 22px;margin:20px 0;font-size:.95rem}
.transition-box h3{color:var(--transition);margin-top:0}
.recommendation{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:8px;padding:14px 18px;margin:10px 0}
.recommendation-num{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;text-align:center;line-height:26px;font-weight:700;font-size:.85rem;margin-right:8px}
.recommendation-title{font-weight:700;color:var(--text);display:inline}
.recommendation-desc{font-size:.9rem;color:var(--muted);margin-top:6px;margin-left:34px}
.orp-box{background:#e3f2fd;border-left:4px solid #1565c0;border-radius:8px;padding:16px 18px;margin:20px 0;font-size:.9rem}
.orp-box strong{color:#0d47a1}
.dont-box{background:#fafafa;border-left:4px solid #9e9e9e;border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.88rem;color:var(--muted)}
.adult-path{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.adult-path-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.adult-path-title{font-weight:700;font-size:1rem;color:var(--text)}
.adult-path-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;font-size:.85rem;margin-top:8px}
.adult-path-item .adult-path-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:2px}
.adult-path-item .adult-path-value{color:var(--text);line-height:1.4}
ul{padding-left:22px;margin:10px 0 16px}li{margin-bottom:6px}
.progress-wrap{margin-bottom:22px}
.progress-meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px;font-weight:500}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#2a7f9a);border-radius:4px;transition:width .35s ease}
.progress-fill.int{background:linear-gradient(90deg,var(--teal),#26a69a)}
.question-num{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.question-num.int{color:var(--teal)}
.question-text{font-size:1.35rem;font-weight:600;line-height:1.4;margin-bottom:8px;min-height:3.5em;word-wrap:break-word}
.question-hint{font-size:.85rem;color:var(--muted);margin-bottom:22px;font-style:italic}
.likert{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.likert-option{display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .15s;font-size:1rem;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.likert-option:hover{border-color:var(--primary);background:#f0f7fa}
.likert-option.selected{border-color:var(--primary);background:#d9ebf1;font-weight:600}
.likert-option .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all .15s;position:relative}
.likert-option.selected .dot{border-color:var(--primary);background:var(--primary)}
.likert-option.selected .dot::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:#fff;border-radius:50%}
.scale-preview{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:14px 0}
.scale-row{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--border);background:var(--bg);font-size:.95rem}
.scale-row:last-child{border-bottom:none}
.scale-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:.85rem;flex-shrink:0}
.form-group{margin-bottom:22px}
.form-label{display:block;font-size:.9rem;font-weight:700;color:var(--primary);margin-bottom:10px}
.form-hint{font-size:.82rem;color:var(--muted);margin-bottom:10px;font-style:italic}
.form-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.form-option{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:2px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:all .15s;font-size:.92rem;font-family:inherit;color:var(--text);text-align:left}
.form-option:hover{border-color:var(--primary);background:#f0f7fa}
.form-option.selected{border-color:var(--primary);background:#d9ebf1;font-weight:600}
.form-check{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;position:relative;transition:all .15s}
.form-option.selected .form-check{border-color:var(--primary);background:var(--primary)}
.form-option.selected .form-check::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:.75rem;font-weight:800}
.axis-row{background:var(--bg);padding:16px;border-radius:10px;margin-bottom:14px}
.axis-title{font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:10px}
.axis-bar{position:relative;height:12px;background:linear-gradient(90deg,#c62828 0%,#e0e0e0 50%,#1a5f7a 100%);border-radius:6px;margin:14px 0 6px}
.axis-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--text);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.axis-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600}
.axis-value{text-align:center;font-size:.9rem;font-weight:700;margin-top:8px;color:var(--text)}
.territory{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;transition:all .2s}
.territory.primary{border-width:2px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.territory.excluded{opacity:.55;border-style:dashed}
.territory-header{padding:18px 20px;display:flex;align-items:center;gap:14px;background:var(--bg);border-bottom:1px solid var(--border)}
.territory.primary .territory-header{background:linear-gradient(135deg,#eaf4f8,#d9ebf1)}
.territory.excluded .territory-header{background:#fafafa}
.territory-badge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.1rem;flex-shrink:0}
.territory.excluded .territory-badge{filter:grayscale(.7)}
.territory-info{flex:1}
.territory-name{font-weight:700;font-size:1.05rem;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.territory-score{font-size:.85rem;color:var(--muted);margin-top:2px}
.territory-why{font-size:.85rem;color:var(--muted);margin-top:4px;font-style:italic}
.territory-content{padding:0}
.territory-content.collapsed{display:none}
.excluded-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:#ffebee;color:var(--danger)}
.path-group-header{padding:12px 20px;background:#f7fafc;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border)}
.path-group-header.direct{background:#e8f5e9;color:var(--success)}
.path-group-header.transition{background:#fff3e0;color:var(--warn)}
.path-group-header.academic{background:#ede7f6;color:var(--academic)}
.path-group-header.not-relevant{background:#eeeeee;color:var(--muted)}
.path-group-header.duration-blocked,.path-group-header.finance-blocked,.path-group-header.region-blocked{background:#ffebee;color:var(--danger)}
.path-card{padding:16px 20px;border-bottom:1px solid var(--border)}
.path-card:last-child{border-bottom:none}
.path-card.path-direct{border-left:3px solid var(--success)}
.path-card.path-transition{border-left:3px solid var(--warn)}
.path-card.path-academic{border-left:3px solid var(--academic)}
.path-card.path-not-relevant{opacity:.6;border-left:3px solid #bdbdbd}
.path-card.path-duration-blocked,.path-card.path-finance-blocked,.path-card.path-region-blocked{opacity:.7;border-left:3px solid var(--danger);background:#fffafa}
.path-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.path-level{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.level-afp{background:#fff3e0;color:#e65100}
.level-cfc{background:#e3f2fd;color:#1565c0}
.level-es{background:#e8f5e9;color:#2e7d32}
.level-hes{background:#f3e5f5;color:#6a1b9a}
.level-uni{background:#ede7f6;color:#4527a0}
.level-epf{background:#e0f2f1;color:#00695c}
.level-brevet{background:#fff8e1;color:#ef6c00}
.path-title{font-weight:600;font-size:.95rem}
.path-meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-size:.76rem}
.path-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-weight:700}
.badge-paid{background:#e8f5e9;color:#2e7d32}
.badge-salary{background:#e3f2fd;color:#1565c0}
.badge-unpaid{background:#fff3e0;color:#e65100}
.badge-accessible{background:#e8f5e9;color:#2e7d32}
.badge-modere{background:#fff8e1;color:#ef6c00}
.badge-selectif{background:#ffebee;color:#c62828}
.badge-permis{background:#f3e5f5;color:#6a1b9a}
.badge-bilingue{background:#e0f2f1;color:#00695c}
.mp-note{margin-top:6px;padding:6px 10px;background:#f0f4ff;border-left:3px solid #5e35b1;border-radius:4px;font-size:.78rem;color:#4527a0}
.path-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;font-size:.85rem;margin-top:8px}
.path-item .path-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:2px}
.path-item .path-value{color:var(--text);line-height:1.4}
.path-warning{margin-top:8px;padding:8px 12px;background:#fff8e1;border-left:3px solid var(--warn);border-radius:6px;font-size:.82rem;color:#8b5a00}
.path-warning.danger{background:#ffebee;border-left-color:var(--danger);color:var(--danger)}
.path-warning.info{background:#e3f2fd;border-left-color:#1565c0;color:#0d47a1}
.expand-toggle{text-align:center;padding:16px;background:var(--bg);border-radius:10px;margin-top:20px;cursor:pointer;font-weight:600;color:var(--primary);font-size:.9rem;border:1px dashed var(--border)}
.expand-toggle:hover{background:#eaf0f4}
.cross-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.cross-item{padding:12px 14px;background:#fff;border-radius:8px;border:1px solid #f8bbd0}
.cross-item-title{font-weight:700;font-size:.92rem;color:var(--cross);margin-bottom:4px}
.cross-item-desc{font-size:.85rem;color:var(--text);line-height:1.4}
footer{text-align:center;padding:18px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--border);background:var(--surface)}
@media(max-width:600px){main{padding:16px 12px 32px}.card{padding:22px 18px}h1{font-size:1.3rem}.question-text{font-size:1.1rem;min-height:4em}.path-grid,.adult-path-grid{grid-template-columns:1fr}.territory-header{padding:14px 16px}.path-card{padding:14px 16px}.form-options{grid-template-columns:1fr}}
@media print{header,footer,.actions,.btn,.progress-wrap,.expand-toggle{display:none!important}body{background:#fff}.card{box-shadow:none;padding:0}.territory-content.collapsed{display:block!important}}
</style>

/* ========== STATE ========== */
const state = {
  lang:'fr',screen:'welcome',
  context:{niveau:null,age:null,region:null,duree:null,mobilite:null,experience:null,finances:null,permis:null,langueFaible:null,languesFortes:[],exclusions:[],skills:[]},
  axisOrder:[],axisCursor:0,axisAnswers:{},
  intOrder:[],intCursor:0,intAnswers:{},
  axisScores:{PT:0,DI:0},intScores:{},territoryScores:[],showAllTerritories:false
};

/* ========== UTILS ========== */
function t(k){const v=T[state.lang][k];return v!==undefined?v:k}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=b[i];b[i]=b[j];b[j]=tmp}return b}
function fl(o){return o[state.lang]}

/* ========== SCORING ========== */
function computeAxes(){
  let P=0,T_=0,D=0,I=0;
  for(const idx in state.axisAnswers){
    const item=AXIS_ITEMS[+idx];if(!item)continue;
    const v=state.axisAnswers[idx];
    if(item.axis==='PT'){if(item.pole==='P')P+=v;else T_+=v}
    else{if(item.pole==='D')D+=v;else I+=v}
  }
  state.axisScores.PT=Math.round(((P-T_)/8)*100);
  state.axisScores.DI=Math.round(((D-I)/8)*100);
}
function computeInterests(){
  const sums={};Object.keys(INTERESTS).forEach(k=>sums[k]=0);
  for(const idx in state.intAnswers){
    const item=ITEMS_INT[+idx];if(!item)continue;
    sums[item[0]]+=state.intAnswers[idx];
  }
  const norm={};
  Object.keys(sums).forEach(k=>{norm[k]=Math.round(((sums[k]-3)/12)*100)});
  state.intScores=norm;
}
function computeTerritoryScores(){
  const results=TERRITOIRES.map(terr=>{
    let wSum=0,wTot=0;
    for(const intId in terr.interets){wSum+=(state.intScores[intId]||0)*terr.interets[intId];wTot+=terr.interets[intId]}
    const score=wTot>0?Math.round(wSum/wTot):0;
    const matched=Object.keys(terr.interets).sort((a,b)=>terr.interets[b]-terr.interets[a]);
    const isExcluded=terr.exclusions.some(ex=>state.context.exclusions.includes(ex));
    return {territoire:terr,score:score,matchedInts:matched,isExcluded:isExcluded};
  });
  results.sort((a,b)=>b.score-a.score);
  state.territoryScores=results;
}
function getTopInterests(n){
  return Object.entries(state.intScores).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id,s])=>({id:id,label:INTERESTS[id],score:s}));
}
function isTransitionProfile(){
  const activeTerr=state.territoryScores.filter(r=>!r.isExcluded);
  const maxTerr=activeTerr.length>0?activeTerr[0].score:0;
  const maxInt=Math.max(...Object.values(state.intScores));
  const excl=state.context.exclusions.length;
  return maxInt<50||maxTerr<40||excl>=5;
}

/* ========== PATH META ========== */
function getPathMeta(path){
  const titleFr=path.titre.fr.toLowerCase();
  let remun=path.niveau==='Brevet'?'salary_maintained':(path.niveau==='AFP'||path.niveau==='CFC')?'paid':'unpaid';
  let select=null;
  if(path.niveau==='CFC'){select=path.select||'modere'}
  else if(path.niveau==='AFP'){select='accessible'}
  const permis=path.permis||titleFr.includes('mécanic')||titleFr.includes('électric')||titleFr.includes('agricul')||titleFr.includes('forest');
  return {remun:remun,select:select,permis:permis,mp:path.niveau==='CFC'};
}

/* ========== RÉGION ACCESSIBLE ========== */
function isRegionAccessible(path){
  const userRegion=state.context.region;
  const mobilite=state.context.mobilite;
  if(!userRegion||!mobilite)return true;
  if(mobilite==='suisse'||mobilite==='etranger')return true;
  if(path.region==='suisse')return true;
  // path.region = 'lemanique' : accessible si l'utilisateur est en arc lémanique ou s'il accepte toute la Suisse
  if(path.region==='lemanique'){
    if(mobilite==='ville')return userRegion==='lemanique';
    if(mobilite==='region')return userRegion==='lemanique'||userRegion==='mittelland';
    return true;
  }
  return true;
}

/* ========== CATEGORIZE ========== */
function categorizeAccess(path,terrId){
  const meta=getPathMeta(path);
  const c=state.context;
  
  // Age filter : 40+ → AFP/CFC complètement masqués
  if(c.age && (c.age==='40-49'||c.age==='50-59'||c.age==='60+') && (path.niveau==='AFP'||path.niveau==='CFC'))return 'age-hidden';
  if(c.age==='25-39' && path.niveau==='AFP')return 'age-hidden';
  
  // Durée
  const dMax=c.duree==='court'?1:c.duree==='moyen'?2:c.duree==='standard'?3:c.duree==='long'?5:99;
  if(c.duree && path.dureeAns && path.dureeAns>dMax)return 'duration-blocked';
  
  // Région (bloquée si hors mobilité/région)
  if(!isRegionAccessible(path))return 'region-blocked';
  
  // Niveau
  let cat;
  if(c.niveau==='mg'){
    if(path.acces==='academic')cat='direct';
    else if(path.acces==='transition'&&(path.niveau==='HES'||path.niveau==='UNI'||path.niveau==='EPF'))cat='transition';
    else if(path.niveau==='AFP'||path.niveau==='CFC')cat='not-relevant';
    else cat='transition';
  } else if(c.niveau==='hes_uni'){
    if(path.acces==='academic'&&(path.niveau==='UNI'||path.niveau==='EPF'||path.niveau==='HES'))cat='direct';
    else if(path.niveau==='AFP'||path.niveau==='CFC')cat='not-relevant';
    else cat='transition';
  } else if(c.niveau==='cfc'||c.niveau==='mp'){
    if(path.niveau==='AFP')cat='not-relevant';
    else if(path.acces==='direct')cat='direct';
    else if(path.niveau==='UNI'||path.niveau==='EPF')cat='academic';
    else cat='transition';
  } else if(c.niveau==='afp'){
    if(path.niveau==='AFP')cat='not-relevant';
    else cat=path.acces;
  } else {cat=path.acces}
  
  if(c.finances==='oui_absolu'&&meta.remun==='unpaid'&&(cat==='direct'||cat==='transition'||cat==='academic'))return 'finance-blocked';
  
  return cat;
}

/* ========== WARNINGS ========== */
function getPathWarnings(path,terrId,cat){
  const meta=getPathMeta(path);
  const c=state.context;
  const warnings=[];
  
  if(cat==='duration-blocked')warnings.push({type:'danger',text:t('dur_warning')});
  if(cat==='finance-blocked')warnings.push({type:'danger',text:t('fin_warning')});
  if(cat==='region-blocked')warnings.push({type:'danger',text:t('region_warning')});
  if(c.langueFaible==='de' && path.langue==='mixed' && !c.languesFortes.includes('de'))warnings.push({type:'warn',text:t('lang_warning_ethz')});
  else if(c.langueFaible==='de' && path.langue==='de' && !c.languesFortes.includes('de'))warnings.push({type:'warn',text:t('lang_warning')});
  if(c.mobilite==='ville' && path.region==='suisse' && c.region && REGIONS[c.region] && !REGIONS[c.region].langues.includes('fr')){
    // Warning de déplacement uniquement si la voie est hors région linguistique
    warnings.push({type:'info',text:t('mob_warning')});
  }
  if(meta.permis && c.permis!=='oui')warnings.push({type:'warn',text:t('permis_warning')});
  if(meta.select==='selectif')warnings.push({type:'info',text:t('select_warning')});
  
  return warnings;
}

/* ========== CROSS ========== */
function getCrossSuggestions(){
  const userRank=LEVEL_RANK[state.context.niveau]||0;
  const active=state.territoryScores.filter(r=>!r.isExcluded&&r.score>=40).slice(0,4);
  const pairs=[];
  for(let i=0;i<active.length;i++)for(let j=i+1;j<active.length;j++){
    const a=active[i].territoire.id,b=active[j].territoire.id;
    const cross=CROSS_SUGGESTIONS[a+'+'+b]||CROSS_SUGGESTIONS[b+'+'+a];
    if(!cross)continue;
    if(userRank<LEVEL_RANK[cross.minLevel])continue;
    pairs.push({label:fl(active[i].territoire.nom)+' × '+fl(active[j].territoire.nom),desc:cross});
  }
  return pairs;
}

/* ========== ADULT PATHS ========== */
function getRelevantAdultPaths(){
  const userSkills=state.context.skills||[];
  return ADULT_PATHS.filter(p=>{
    if(p.skills.length===0)return true;
    return p.skills.some(s=>userSkills.includes(s));
  });
}

/* ========== TERRITORY CARD ========== */
function renderTerritoryCard(result,index){
  const terr=result.territoire,score=result.score,isExcl=result.isExcluded;
  const isPrimary=!isExcl&&index<3;
  const collapsed=(!isPrimary&&!isExcl&&index>=3&&!state.showAllTerritories)?' collapsed':'';
  const scoreLabel=score>=70?t('matching_strong'):score>=50?t('matching_medium'):t('matching_weak');
  const why=result.matchedInts.map(intId=>esc(fl(INTERESTS[intId]))).join(', ');
  
  const groups={direct:[],transition:[],academic:[],'not-relevant':[],'duration-blocked':[],'finance-blocked':[],'region-blocked':[]};
  terr.voies.forEach(v=>{
    const cat=categorizeAccess(v,terr.id);
    if(cat==='age-hidden')return;
    groups[cat].push(v);
  });
  
  function renderPath(v,cat){
    const meta=getPathMeta(v);
    const levelCls='level-'+v.niveau.toLowerCase().replace('é','e').replace(' ','');
    const levelKey='level_'+v.niveau.toLowerCase().replace('é','e').replace(' ','');
    const levelLabel=t(levelKey)||v.niveau;
    const remunBadge=meta.remun==='paid'?'<span class="path-badge badge-paid">'+esc(t('badge_paid'))+'</span>':meta.remun==='salary_maintained'?'<span class="path-badge badge-salary">'+esc(t('badge_salary'))+'</span>':'<span class="path-badge badge-unpaid">'+esc(t('badge_unpaid'))+'</span>';
    const selectBadge=meta.select==='accessible'?'<span class="path-badge badge-accessible">'+esc(t('badge_accessible'))+'</span>':meta.select==='modere'?'<span class="path-badge badge-modere">'+esc(t('badge_modere'))+'</span>':meta.select==='selectif'?'<span class="path-badge badge-selectif">'+esc(t('badge_selectif'))+'</span>':'';
    const permisBadge=meta.permis&&state.context.permis!=='oui'?'<span class="path-badge badge-permis">'+esc(t('badge_permis'))+'</span>':'';
    const bilingueBadge=(state.context.languesFortes.includes('de')&&(state.context.langueFaible!=='de')&&(v.langue==='mixed'||v.langue==='de'))?'<span class="path-badge badge-bilingue">'+esc(t('badge_bilingue'))+'</span>':'';
    const mpNote=meta.mp?'<div class="mp-note">'+esc(t('mp_note'))+'</div>':'';
    const warnings=getPathWarnings(v,terr.id,cat);
    const warningsHTML=warnings.map(w=>'<div class="path-warning '+w.type+'">⚠️ '+esc(w.text)+'</div>').join('');
    return '<div class="path-card path-'+cat+'"><div class="path-header"><span class="path-level '+levelCls+'">'+esc(levelLabel)+'</span><span class="path-title">'+esc(fl(v.titre))+'</span></div>'+
      '<div class="path-meta">'+remunBadge+selectBadge+permisBadge+bilingueBadge+'</div>'+
      '<div class="path-grid">'+
        '<div class="path-item"><div class="path-label">'+esc(t('duree'))+'</div><div class="path-value">'+esc(fl(v.duree))+'</div></div>'+
        '<div class="path-item"><div class="path-label">'+esc(t('prerequis'))+'</div><div class="path-value">'+esc(fl(v.prerequis))+'</div></div>'+
        '<div class="path-item"><div class="path-label">'+esc(t('passerelle'))+'</div><div class="path-value">'+esc(fl(v.passerelle))+'</div></div>'+
      '</div>'+mpNote+warningsHTML+'</div>';
  }
  
  let pathsHTML='';
  const order=['direct','transition','academic','duration-blocked','finance-blocked','region-blocked','not-relevant'];
  const labels={direct:t('path_direct'),transition:t('path_transition'),academic:t('path_academic'),'duration-blocked':t('path_duration_blocked'),'finance-blocked':t('path_finance_blocked'),'region-blocked':t('path_region_blocked'),'not-relevant':t('path_not_relevant')};
  order.forEach(cat=>{
    if(groups[cat].length>0){
      pathsHTML+='<div class="path-group-header '+cat+'">'+esc(labels[cat])+'</div>';
      pathsHTML+=groups[cat].map(v=>renderPath(v,cat)).join('');
    }
  });
  
  const totalPaths=Object.keys(groups).reduce((s,k)=>s+groups[k].length,0);
  if(totalPaths===0)pathsHTML='<div style="padding:16px 20px;color:var(--muted);font-style:italic">'+esc(t('excluded_note'))+'</div>';
  
  return '<div class="territory '+(isPrimary?'primary ':'')+(isExcl?'excluded':'')+'">'+
    '<div class="territory-header"><div class="territory-badge" style="background:'+terr.color+'">'+esc(terr.letter)+'</div>'+

/* ========== NORMAL RESULTS ========== */

    '<div class="axis-labels"><span>← '+esc(t('axis_di_left'))+'</span><span>'+esc(t('axis_di_right'))+' →</span></div>'+

  if(state.context.region)ctx.push(t('context_summary_region')+': '+esc(fl(REGIONS[state.context.region])));
  if(state.context.duree)ctx.push(t('context_summary_duree')+': '+esc(durees[state.context.duree]));
  if(state.context.mobilite)ctx.push(t('context_summary_mobilite')+': '+esc(mobilites[state.context.mobilite]));
  if(state.context.experience)ctx.push(t('context_summary_experience')+': '+esc(experiences[state.context.experience]));
  if(state.context.finances)ctx.push(t('context_summary_finances')+': '+esc(finances[state.context.finances]));
  if(state.context.permis)ctx.push(t('context_summary_permis')+': '+esc(permisO[state.context.permis]));
  if(state.context.langueFaible)ctx.push(t('context_summary_langue_faible')+': '+esc(langues[state.context.langueFaible]));
  if(state.context.languesFortes.length>0)ctx.push(t('context_summary_langues_fortes')+': '+state.context.languesFortes.map(l=>esc(langues[l])).join(', '));
  if(state.context.exclusions.length>0)ctx.push(t('context_summary_exclusions')+': '+state.context.exclusions.map(e=>esc(exclusions[e])).join(', '));
  if(state.context.skills.length>0)ctx.push(t('context_summary_skills')+': '+state.context.skills.map(s=>esc(fl(SKILLS[s]))).join(', '));

function renderResults(){
  return isTransitionProfile()?renderTransitionResults():renderNormalResults();
}

/* ========== MAIN RENDER avec correction UX scroll ========== */
let _lastScreen=null;
function render(){
  let html='';
  const currentScreen=state.screen;
  switch(state.screen){
    case 'welcome':html=renderWelcome();break;
    case 'context':html=renderContext();break;
    case 'axes_intro':html=renderAxesIntro();break;
    case 'axes':html=renderAxisQ();break;
    case 'int_intro':html=renderIntIntro();break;
    case 'interests':html=renderIntQ();break;
    case 'results':html=renderResults();break;
    default:html=renderWelcome();
  }
  const app=document.getElementById('app');
  const scrollBefore=window.scrollY;
  app.innerHTML=html;
  // CORRECTION UX : ne remonte que si on change réellement d'écran
  if(_lastScreen!==null && _lastScreen!==currentScreen){
    window.scrollTo({top:0,behavior:'smooth'});
  } else if(_lastScreen===currentScreen){
    window.scrollTo({top:scrollBefore,behavior:'instant'});
  }
  _lastScreen=currentScreen;
}

/* ========== NAVIGATION ========== */
function setLang(l){if(l!=='fr'&&l!=='de')return;state.lang=l;document.documentElement.lang=l;
  document.getElementById('btn-lang-fr').classList.toggle('active',l==='fr');
  document.getElementById('btn-lang-de').classList.toggle('active',l==='de');
  document.getElementById('footer-text').textContent=t('footer');render()}
function setField(f,v){state.context[f]=v;render()}
function toggleArr(f,v){
  if(state.context[f].includes(v)){state.context[f]=state.context[f].filter(x=>x!==v)}
  else{if(f==='matieres'&&state.context[f].length>=2)return;state.context[f].push(v)}
  render()
}
function setLangueFaible(v){state.context.langueFaible=state.context.langueFaible===v?null:v;render()}
function validateContext(){
  const c=state.context;
  if(!c.niveau||!c.age||!c.region||!c.duree||!c.mobilite||!c.experience||!c.finances||!c.permis)return;
  state.screen='axes_intro';render();
}
function startAxes(){state.axisOrder=shuffle(AXIS_ITEMS.map((_,i)=>i));state.axisCursor=0;state.axisAnswers={};state.screen='axes';render()}
function answerAxis(v){
  if(state.screen!=='axes')return;
  state.axisAnswers[state.axisOrder[state.axisCursor]]=v;
  if(state.axisCursor<state.axisOrder.length-1){state.axisCursor++;render()}
  else{computeAxes();state.screen='int_intro';render()}
}
function startInt(){state.intOrder=shuffle(ITEMS_INT.map((_,i)=>i));state.intCursor=0;state.intAnswers={};state.screen='interests';render()}
function answerInt(v){
  if(state.screen!=='interests')return;
  state.intAnswers[state.intOrder[state.intCursor]]=v;
  if(state.intCursor<state.intOrder.length-1){state.intCursor++;render()}
  else{computeInterests();computeTerritoryScores();state.screen='results';render()}
}
function goBack(){
  if(state.screen==='context'){state.screen='welcome'}
  else if(state.screen==='axes_intro'){state.screen='context'}
  else if(state.screen==='axes'){if(state.axisCursor>0){state.axisCursor--}else{state.screen='axes_intro'}}
  else if(state.screen==='int_intro'){state.screen='axes';state.axisCursor=state.axisOrder.length-1}
  else if(state.screen==='interests'){if(state.intCursor>0){state.intCursor--}else{state.screen='int_intro'}}
  render()
}
function restart(){
  _lastScreen=null;
  state.screen='welcome';state.axisOrder=[];state.axisCursor=0;state.axisAnswers={};
  state.intOrder=[];state.intCursor=0;state.intAnswers={};
  state.axisScores={PT:0,DI:0};state.intScores={};state.territoryScores=[];state.showAllTerritories=false;
  state.context={niveau:null,age:null,region:null,duree:null,mobilite:null,experience:null,finances:null,permis:null,langueFaible:null,languesFortes:[],exclusions:[],skills:[]};
  render()
}
function toggleTerr(){state.showAllTerritories=!state.showAllTerritories;render()}

/* ========== EVENTS ========== */
document.addEventListener('click',function(e){
  let tgt=e.target;
  while(tgt&&tgt!==document){
    if(tgt.dataset&&tgt.dataset.action){
      const a=tgt.dataset.action,v=tgt.dataset.value;
      switch(a){
        case 'set-lang':setLang(tgt.dataset.lang);break;
        case 'go-context':state.screen='context';render();break;
        case 'set-niveau':setField('niveau',v);break;
        case 'set-age':setField('age',v);break;
        case 'set-region':setField('region',v);break;
        case 'set-duree':setField('duree',v);break;
        case 'set-mobilite':setField('mobilite',v);break;
        case 'set-experience':setField('experience',v);break;
        case 'set-finances':setField('finances',v);break;
        case 'set-permis':setField('permis',v);break;
        case 'set-langue-faible':setLangueFaible(v);break;
        case 'toggle-langue-forte':toggleArr('languesFortes',v);break;
        case 'toggle-exclusion':toggleArr('exclusions',v);break;
        case 'toggle-skill':toggleArr('skills',v);break;
        case 'toggle-matiere':toggleArr('matieres',v);break;
        case 'validate-context':validateContext();break;
        case 'begin-axes':startAxes();break;
        case 'answer-axis':answerAxis(parseInt(v,10));break;
        case 'begin-interests':startInt();break;
        case 'answer-int':answerInt(parseInt(v,10));break;
        case 'go-back':goBack();break;
        case 'restart':restart();break;
        case 'print':window.print();break;
        case 'toggle-territories':toggleTerr();break;
      }
      return;
    }
    tgt=tgt.parentNode;
  }
});

document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if((state.screen==='axes'||state.screen==='interests')&&e.key>='1'&&e.key<='5'){
    const v=parseInt(e.key,10);
    if(state.screen==='axes')answerAxis(v);else answerInt(v);
  } else if(e.key==='Escape'){
    if(state.screen!=='welcome'&&state.screen!=='results')goBack();
  }
});

function init(){
  document.documentElement.lang='fr';
  document.getElementById('btn-lang-fr').classList.add('active');
  document.getElementById('footer-text').textContent=T.fr.footer;
  render();
}
init();
</script>
